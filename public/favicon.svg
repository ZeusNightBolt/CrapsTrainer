<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ft" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ff7d80"/><stop offset="1" stop-color="#f23d43"/>
    </linearGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d92a30"/><stop offset="1" stop-color="#b81d23"/>
    </linearGradient>
    <linearGradient id="fr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a81b21"/><stop offset="1" stop-color="#7f1017"/>
    </linearGradient>
    <radialGradient id="pip" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe3e8"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="50" cy="93" rx="33" ry="5.5" fill="#000" opacity="0.28" filter="url(#soft)"/>

  <!-- three visible faces of the cube (a valid 5 / 3 / 6 corner) -->
  <polygon points="50,8 85,28 50,48 15,28" fill="url(#ft)" stroke="#6d0f14" stroke-width="0.5" stroke-linejoin="round"/>
  <polygon points="15,28 50,48 50,92 15,72" fill="url(#fl)" stroke="#5c0d12" stroke-width="0.5" stroke-linejoin="round"/>
  <polygon points="85,28 50,48 50,92 85,72" fill="url(#fr)" stroke="#4d0a0f" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- lit top rim -->
  <polyline points="15,28 50,8 85,28" fill="none" stroke="#ffd0d1" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>

  <!-- pips: drawn in unit grid space, mapped onto each face plane by a matrix
       so they foreshorten correctly (circles become ellipses on the tilted faces) -->
  <g fill="url(#pip)">
    <!-- TOP face = 5 -->
    <g transform="matrix(35 -20 35 20 15 28)">
      <circle cx="0.28" cy="0.28" r="0.085"/><circle cx="0.72" cy="0.28" r="0.085"/>
      <circle cx="0.5" cy="0.5" r="0.085"/>
      <circle cx="0.28" cy="0.72" r="0.085"/><circle cx="0.72" cy="0.72" r="0.085"/>
    </g>
    <!-- LEFT face = 3 -->
    <g transform="matrix(35 20 0 44 15 28)">
      <circle cx="0.28" cy="0.28" r="0.08"/><circle cx="0.5" cy="0.5" r="0.08"/><circle cx="0.72" cy="0.72" r="0.08"/>
    </g>
    <!-- RIGHT face = 6 -->
    <g transform="matrix(35 -20 0 44 50 48)">
      <circle cx="0.28" cy="0.26" r="0.075"/><circle cx="0.28" cy="0.5" r="0.075"/><circle cx="0.28" cy="0.74" r="0.075"/>
      <circle cx="0.72" cy="0.26" r="0.075"/><circle cx="0.72" cy="0.5" r="0.075"/><circle cx="0.72" cy="0.74" r="0.075"/>
    </g>
  </g>
</svg>
