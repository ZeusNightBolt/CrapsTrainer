<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33343c"/>
      <stop offset=".5" stop-color="#17181e"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe694"/>
      <stop offset=".55" stop-color="#f5c518"/>
      <stop offset="1" stop-color="#c99a06"/>
    </linearGradient>
  </defs>
  <!-- back die: two pips -->
  <g transform="translate(21 20) rotate(-17)">
    <rect x="-13" y="-13" width="26" height="26" rx="6" fill="url(#die)" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="-5.5" cy="-5.5" r="2.4" fill="url(#gold)"/>
    <circle cx="5.5" cy="5.5" r="2.4" fill="url(#gold)"/>
  </g>
  <!-- front die: five pips (5 + 2 = a lucky seven) -->
  <g transform="translate(40 42) rotate(13)">
    <rect x="-17" y="-17" width="34" height="34" rx="8" fill="url(#die)" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="-9" cy="-9" r="3.1" fill="url(#gold)"/>
    <circle cx="9" cy="-9" r="3.1" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="3.1" fill="url(#gold)"/>
    <circle cx="-9" cy="9" r="3.1" fill="url(#gold)"/>
    <circle cx="9" cy="9" r="3.1" fill="url(#gold)"/>
  </g>
</svg>
