name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages work under a single "pages" group and DO NOT cancel an
# in-flight run: cancelling a deployment mid-flight is what leaves the
# github-pages environment stuck and makes actions/deploy-pages fail fast with
# "Deployment failed, try again later." This mirrors GitHub's official Pages
# starter workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify   # fail the build if any payout drifts from theory
      - run: npm run build
      - run: npm test         # unit + build smoke tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Publish on a push to main or a manual re-run (workflow_dispatch) — never on
  # a pull_request, whose run stops after `build` so PRs get verify+build+test
  # without touching the live Pages deployment. Making it dispatch-runnable
  # means a stuck deploy can be re-published from the Actions tab without a new
  # commit.
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
